version: "3.8"

services:
 mongo:
  image: mongo
  ports:
  - 27017:27017
  environment:
   MONGO_INITDB_ROOT_USERNAME: muskan
   MONGO_INITDB_ROOT_PASSWORD: password 


 mongo-express:
  image: mongo-express
  ports:
  - 8081:8081
  environment:
   ME_CONFIG_MONGODB_ADMINUSERNAME: muskan 
   ME_CONFIG_MONGODB_ADMINPASSWORD: password 
   ME_CONFIG_MONGODB_URL: mongodb://muskan:password@mongo:27017/
