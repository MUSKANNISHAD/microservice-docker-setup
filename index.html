<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .outer {
        width: 400px;
        background: white;
        padding: 35px 40px;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    .outer h1 {
        text-align: center;
        font-size: 28px;
        margin-bottom: 30px;
        color: #222;
    }

    .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .field label {
        font-size: 15px;
        font-weight: 600;
        color: #333;
    }

    .field input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
    }

    .field input:focus {
        border-color: #007bff;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
    }

    .field input::placeholder {
        color: #999;
    }

    #fromButton {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: none;
        border-radius: 6px;
        background: #007bff;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    #fromButton:hover {
        background: #0056b3;
    }

    #fromButton:active {
        transform: scale(0.98);
    }
</style>

<body>
    <div class="outer">

        <h1>Hi User, Welcome to the App</h1>

        <form action="/addUser" method="post" target="_blank" id="signUpForm">

            <div class="field">
                <label for="email">Email</label>
                <input id="email" placeholder="enter your Email" type="email" name="email">
            </div>

            <div class="field">
                <label for="username">Username</label>
                <input id="username" placeholder="Enter username" type="text" name="username">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" placeholder="Enter password" type="password" name="password">
            </div>

            <button id="fromButton" type="submit">Sign Up</button>

        </form>

    </div>
    </form>
    <script>
        function resetForm() {
            let myForm = document.querySelector("#signUpForm");
            console.log("hii", myForm);
            myForm.reset();
            return false;
        }
    </script>

</body>

</html>
